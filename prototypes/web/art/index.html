<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>단풍골 맵 확인 · 새 아트</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f12;color:#eee;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0}
  #gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ov{pointer-events:none}
  #hud{position:fixed;top:8px;left:8px;max-width:min(560px,calc(100vw - 16px));background:#000a;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
  #hud.closed .body{display:none}
  #hud .row{margin:3px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  #hud .lab{color:#cdb98f;margin-right:2px}
  #zoneName{font-size:16px;font-weight:bold;margin-right:8px}
  button{font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #6b5a40;background:#2a241c;color:#eee;cursor:pointer}
  button.on{background:#d9a856;color:#1b140b;border-color:#d9a856}
  #count{color:#9fd08a;margin-left:auto}
  #help{color:#aaa;font-size:12px}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
  #toast.show{opacity:1}
  #touch{position:fixed;inset:auto 0 0 0;height:0;display:none}
  #touch.show{display:block}
  #touch button{position:fixed;bottom:18px;width:64px;height:64px;border-radius:50%;font-size:15px;background:#0008;border:2px solid #d9a85688;color:#fff}
  #tL{left:18px}#tR{left:94px}#tU{right:94px}#tJ{right:18px}
  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:16px;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<div id="hud">
  <div class="row"><span id="zoneName">단풍골</span><button id="fold">메뉴 접기</button><span id="count">에셋 0/79</span></div>
  <div class="body">
    <div class="row"><span class="lab">구역</span><span id="zones"></span></div>
    <div class="row"><span class="lab">보기</span>
      <button id="tOverlay">웹 게임 구조 겹쳐 보기</button><button id="tLabels" class="on">빈 자리 이름표</button></div>
    <div class="row"><span class="lab">조명</span><span id="presets"></span></div>
    <div class="row" id="states"></div>
    <div id="help">←→(A·D) 걷기 · 스페이스(↑·W) 뛰기 · ↓(S) 발판 아래로 · E(↓) 문 들어가기 · 구역 끝으로 걸어가면 다음 구역</div>
  </div>
</div>
<div id="toast"></div>
<div id="touch"><button id="tL">◀</button><button id="tR">▶</button><button id="tU">쓰기</button><button id="tJ">뛰기</button></div>
<div id="nogl">이 브라우저는 WebGL2를 지원하지 않아 맵을 그릴 수 없습니다. 최신 Chrome이나 Safari로 열어 주세요.</div>
<script src="stage1-layout.js?v=1"></script>
<script src="viewer.js?v=1"></script>
</body>
</html>
